[project]
name = "Leadgerflare_Web_Application"
version = "1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "apscheduler",
  "colorama",
  "crispy-tailwind",
  "cryptography",
  "pydantic-settings",
  "Django~=6.0",
  "django-admin-rangefilter",
  "django-components",
  "django-cors-headers",
  "django-crispy-forms",
  "django-auditlog",
  "django-extensions",
  "django-filter",
  "django-guardian",
  "django-import-export",
  "django-log-viewer",
  "django-maintenance-mode",
  "django-session-timeout",
  "valkey",
  "django-valkey",
  "django-vite-boilerplate",
  "django-widget-tweaks",
  "djangorestframework",
  "drf-standardized-errors",
  "gunicorn",
  "numpy",
  "pandas",
  "Pillow",
  "prettytable",
  "psycopg[binary]",
  "python-json-logger",
  "python-magic",
  "PyYAML",
  "requests",
  "sentry-sdk[django]",
  "inflection",
  "python-json-logger",
  "django-axes>=6.0.0",
  "django-csp>=4.0.0",
  "whitenoise",
  "drf-spectacular",
  "prettyprinter",
  "termcolor",
  "nh3>=0.3.6",
  "beautifulsoup4>=4.15.0",
]

[dependency-groups]
# Core development tools (testing, debugging)
dev = [
  "django-model-info",
  "django-admin-cli",
  "Werkzeug",
  "bpython",
  "colorlog",
  # Type Checking
  "mypy",
  "django-stubs",
  "djangorestframework-stubs",
  # Developer Experience
  "ipython",
  "django-debug-toolbar",
  "django-debugtools>=2.0",
  "coverage>=7.15.2",
  "django-coverage-plugin>=3.2.2",
]

# Code quality and static analysis
lint = [
  "ruff",
  "mypy",
  "django-stubs",
  "black",
  # Template Formatting
  "djlint",
  # Security
  "bandit",
]

# Testing
testing = [
  "pytest",
  "pytest-django",
  "pytest-cov",
  "factory-boy",
  "faker",
  "model-bakery",
  "selenium",
]
# --- Type Checking ---
types = [
  "mypy",
  "mypy-extensions",
  "django-stubs",
  "django-stubs-ext",
  "djangorestframework-stubs[compatible-mypy]",
  "types-requests",
]

# Documentation generation
docs = [
  "mkdocs",
  "mkdocs-material",
  "sphinx",
  "autotyping",
  "infer-types",
  "MonkeyType",
  "mkdocstrings[python]", # Parses Python code and supports Sphinx/reST style
]

# uv-specific configuration
[tool.uv]
# Set to false if this is an application, not a distributable library.
# This prevents uv from trying to build/install this project as a package.
package = false


[tool.black]
line-length = 85
target-version = ['py314'] # Updated to Python 3.14
preview = true
unstable-feature = true
unstable = true
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
py_version = 314 # Updated to Python 3.14
profile = "django"
line_length = 85
force_single_line = true
use_parentheses = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["your_project_name"] # Replace with your project's name
known_third_party = [
  "django",
  "numpy",
  "pandas",
] # Add your third-party dependencies

[tool.djlint]
profile = "django"
extension = "html,djhtml"
indent = 4
# exclude directories and file patterns (comma separated)
exclude = ".venv,venv,.tox,build,dist,node_modules,src,src/**,**/*.py,**/__pycache__,**/migrations/**"
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,extends,include"
max_line_length = 95
format_attribute_template_tags = true
format_js = true
format_css = true
ignore = "H006, H014"


[tool.mypy]
python_version = "3.14"             # Updated to Python 3.14
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_subclassing_any = true
exclude = ["docs", "test", "tests"]

[tool.bandit]
targets = ["."]
skips = ["B101"] # Example: Skip assert statement checks

[tool.docformatter]
wrap-summaries = 82
wrap-descriptions = 81
blank = true
pre-summary-newline = true
pre-summary-space = true
make-summary-multi-line = true
