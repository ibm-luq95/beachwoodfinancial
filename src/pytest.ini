[pytest]
DJANGO_SETTINGS_MODULE = beach_wood_financial_proj.settings.test
python_files = test_*.py
python_functions = test_*
addopts = -p no:warnings
markers =
    unit: Fast unit tests (models, serializers, helpers)
    integration: Integration & view tests
    security: Encryption, audit logging, middleware tests
    guardian: Object-level permission tests
    workflow: Multi-app end-to-end integration workflows
    slow: Long running tests (deselect with '-m "not slow"')
