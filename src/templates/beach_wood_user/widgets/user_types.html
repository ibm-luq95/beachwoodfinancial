{% with id=widget.attrs.id %}
    <div {% if id %}id="{{ id }}"{% endif %} class="w-full">
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">
            Select Role
        </label>
        <div class="bg-zinc-100/90 dark:bg-zinc-800/70 p-1 rounded-xl grid grid-cols-2 sm:grid-cols-4 gap-1 border border-zinc-200/70 dark:border-zinc-700/60">
            {% for group, options, index in widget.optgroups %}
                {% for option in options %}
                    {% include option.template_name with widget=option %}
                {% endfor %}
            {% endfor %}
        </div>
    </div>
{% endwith %}
