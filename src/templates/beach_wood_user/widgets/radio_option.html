<label class="group relative flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg cursor-pointer transition-all duration-150 select-none text-center text-zinc-600 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-200 has-[:checked]:bg-white has-[:checked]:text-zinc-950 has-[:checked]:shadow-xs has-[:checked]:font-semibold dark:has-[:checked]:bg-zinc-700 dark:has-[:checked]:text-zinc-50 dark:has-[:checked]:shadow-xs">
    <input name="{{ widget.name }}"
           type="{{ widget.type }}"
           {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
           {% if widget.attrs.checked or widget.value == "manager" %}checked{% endif %}
           class="sr-only"
           {% include "django/forms/widgets/attrs.html" %} />
    
    <span class="text-xs text-zinc-400 group-hover:text-zinc-600 dark:text-zinc-500 dark:group-hover:text-zinc-300 group-has-[:checked]:text-zinc-900 dark:group-has-[:checked]:text-zinc-100 transition-colors">
        {% if widget.value == "manager" %}
            <i class="fa-solid fa-user-tie"></i>
        {% elif widget.value == "assistant" %}
            <i class="fa-solid fa-bolt"></i>
        {% elif widget.value == "bookkeeper" %}
            <i class="fa-solid fa-book-journal-whills"></i>
        {% elif widget.value == "cfo" %}
            <i class="fa-solid fa-chart-line"></i>
        {% else %}
            <i class="fa-solid fa-user"></i>
        {% endif %}
    </span>

    <span class="text-xs tracking-tight">
        {% if widget.label == "Cfo" %}
            CFO
        {% else %}
            {{ widget.label }}
        {% endif %}
    </span>
</label>
