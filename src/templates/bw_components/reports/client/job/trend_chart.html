{% load i18n core_tags %}

<div class="flex flex-col bg-white border border-gray-200 rounded-xl shadow-xs dark:bg-neutral-800 dark:border-neutral-700 mb-6 mx-1 sm:mx-0 transition-all">
    <!-- Chart Header with Collapse Toggle -->
    <div class="flex justify-between items-center px-5 py-3.5 border-b border-gray-200 dark:border-neutral-700">
        <div class="flex items-center gap-2">
            <span class="inline-flex justify-center items-center w-7 h-7 rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400">
                <i class="fa-solid fa-chart-area text-xs"></i>
            </span>
            <div>
                <h2 class="text-sm font-bold text-gray-800 dark:text-neutral-200">
                    {% translate "Annual Workload & Status Distribution" %}
                </h2>
                <p class="text-[11px] text-gray-500 dark:text-neutral-400">
                    {% translate "Month-by-month breakdown across Completed, In-Progress, and Past Due jobs for FY" %} {{ selected_period_year }}
                </p>
            </div>
        </div>

        <button type="button"
                id="trendChartCollapseToggle"
                class="inline-flex items-center gap-x-1.5 py-1 px-2.5 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-200 transition-colors print:hidden">
            <span class="text-xs">{% translate "Toggle Chart" %}</span>
            <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200 rotate-180"></i>
        </button>
    </div>

    <!-- Chart Body Container -->
    <div id="trendChartCollapseArea" class="w-full overflow-hidden transition-all duration-300">
        <div class="p-5">
            <!-- ApexChart Container -->
            <div id="jobsReportTrendChart" class="w-full min-h-[290px]"></div>
        </div>
    </div>

    <!-- Embedded Safe JSON Data -->
    <script id="jobsReportChartData" type="application/json">{{ monthly_trends_json|safe }}</script>
</div>
